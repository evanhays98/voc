  <path d="M264 180 Q362 168 424 188 L424 366 Q362 346 264 358 Z" fill="white" opacity="0.80"/>
  <!-- Spine -->
  <rect x="247" y="172" width="18" height="192" rx="9" fill="#4338ca" opacity="0.2"/>

  <!-- Left page text lines -->
  <rect x="116" y="214" width="108" height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>
  <rect x="116" y="236" width="84"  height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>
  <rect x="116" y="258" width="108" height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>
  <rect x="116" y="280" width="68"  height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>
  <rect x="116" y="302" width="100" height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>
  <rect x="116" y="324" width="78"  height="9" rx="4.5" fill="#4f46e5" opacity="0.22"/>

  <!-- Right page text lines -->
  <rect x="286" y="214" width="108" height="9" rx="4.5" fill="#4f46e5" opacity="0.16"/>
  <rect x="286" y="236" width="80"  height="9" rx="4.5" fill="#4f46e5" opacity="0.16"/>
  <rect x="286" y="258" width="108" height="9" rx="4.5" fill="#4f46e5" opacity="0.16"/>
  <rect x="286" y="280" width="92"  height="9" rx="4.5" fill="#4f46e5" opacity="0.16"/>

  <!-- Sparkle star (top-right) -->
  <path d="M402 96 L408.2 114.9 L428.4 114.9 L412.9 126.2 L419.1 145.1 L402 133.8 L384.9 145.1 L391.1 126.2 L375.6 114.9 L395.8 114.9 Z"
